site_name: FFTjax
repo_url: https://github.com/choROPeNt/FFTjax
repo_name: choROPeNt/FFTjax

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  # Arithmatex bridge for Material
  - javascripts/mathjax.js
  # MathJax v3
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  # Chart.js for the interactive benchmark page
  - https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js
  - javascripts/benchmark.js


extra_css:
  - css/extra.css
  - css/benchmark.css

theme:
  name: material
  logo: assets/fftjax_logo.svg    


  features:
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide

  palette:
    # Light mode
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

plugins:
    - search  # default search plugin; needs manually re-enabling when using any other plugins
    - autorefs  # Cross-links to headings
    - mkdocs-jupyter
    - mkdocstrings:
        handlers:
            python:
                options:
                    inherited_members: true  # Allow looking up inherited methods
                    show_root_heading: true  # actually display anything at all...
                    show_root_full_path: true  # display "diffrax.asdf" not just "asdf"
                    show_if_no_docstring: true
                    show_signature_annotations: true
                    separate_signature: true
                    show_source: true  # don't include source code
                    members_order: source  # order methods according to their order of definition in the source code, not alphabetical order
                    heading_level: 4
                    show_symbol_type_heading: true
                    docstring_style: null

nav:
  - 🏠 Home: index.md
  - 🚀 Getting Started: installation.md
  - 📖 Theorie: theorie.md
  - 🧪 Examples:
      - Overview: examples.md
      - Linear-Elastic Strain: examples/lin-elastic_strain.ipynb
  - ⚡ Benchmark: benchmark.md
