# Active learning — 4-D latent space definition
# Each parameter has a discrete set of candidate values.
# The Cartesian product forms the full candidate set.

parameters:
  - name:   Gc_mat        # MPa·mm  matrix fracture toughness
    values: [0.001, 0.005, 0.01, 0.05, 0.1, 0.5]

  - name:   l0            # mm  phase-field length scale
    values: [0.02, 0.05, 0.1, 0.2, 0.5]

  - name:   Vf_yarn       # fibre packing fraction within tow
    values: [0.50, 0.60, 0.70, 0.78]

  - name:   phi           # overall fibre volume fraction
    values: [0.30, 0.40, 0.50, 0.60]

# Target quantity of interest (label only — for documentation)
target: Gc_eff   # effective fracture toughness extracted from PFF simulation

# ── Observations (fill in as simulations complete) ───────────────────────────
# Each entry: params (dict matching parameter names above) + scalar output.

observations:
  - params:
      Gc_mat:  0.01
      l0:      0.05
      Vf_yarn: 0.70
      phi:     0.50
    output: 0.0087   # Gc_eff [MPa·mm]

  - params:
      Gc_mat:  0.1
      l0:      0.2
      Vf_yarn: 0.60
      phi:     0.40
    output: 0.072
