# Preprocessing config — textile geometry with spatially distributed phi
# Loads an existing VTU or XDMF (from generate_weave_vtu.py or TexGen)
# and re-exports with HDF5 attributes ready for the simulation scripts.
#
# The VolumeFraction field (smooth SDF-based phi) is preserved as-is.
# {geometry.source.stem} → filename stem of the source  (e.g. "200")

geometry:
  type:   textile
  source: data/200.xdmf   # VTU or XDMF from generate_weave_vtu.py / TexGen

  # SDF+tanh smoothing — set > 0 when source has binary VolumeFraction (TexGen VTU).
  # generate_weave_vtu.py output already has smooth phi → set 0 to skip.
  epsilon_voxels: 1.5     # interface half-width in voxels (0 = binary pass-through)
  Vf_yarn:        0.78    # fibre packing within tow (scales smooth phi)

output:  "output/preprocessed/{geometry.type}"
jobname: "{geometry.source.stem}"
