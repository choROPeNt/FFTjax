# Preprocessing config — square-packed circular-fibre RVE
# {geometry.type} → "square_rve"  (used in output path)

geometry:
  type:      square_rve
  phi:       0.35          # target fibre volume fraction
  r_fib:     0.0035        # mm  fibre radius  (= 3.5 µm)
  vox:       0.00005        # mm  voxel size    (= 0.1 µm, isotropic)
  nz:        1           # voxels through thickness
  fibre_dir: [0.0, 0.0, 1.0]   # fibre axis in global frame
  Vf_yarn:   1.0          # fibre packing within tow (1.0 = solid fibre)

output:  output/preprocessed
jobname: "rve_phi{geometry.phi}"
