# Square 2-fibre cell at 75th-PERCENTILE ECCENTRICITY — sized off the large
# RVE's nearest-neighbour statistics rather than guessed.
#
# ---------------------------------------------------------------------------
# HOW THE TARGET WAS SET, AND WHY THE EARLIER ONE WAS WRONG
# ---------------------------------------------------------------------------
# The first attempt at a concentrator (rve_square_2fibre_tight.yaml) was aimed
# at the 1st percentile of the random UD RVE's ALL-PAIRS gap distribution. That
# reference was wrong: in a 29-fibre cell most pairs are not neighbours at all,
# so the all-pairs distribution is dominated by fibres on opposite sides of the
# cell and its median sits at 13 l0, which means nothing mechanically.
#
# Redone over 1468 fibre NEAREST-NEIGHBOUR gaps in the same RVE:
#
#     percentile      1     5    10    25    50    75    90    95
#     NN gap / l0  -0.04  0.62  0.89  1.39  2.25  3.17  4.20  5.00
#     (negative = touching; the minimum is -1.41 l0)
#
# Note the direction: a HIGHER gap percentile means fibres FURTHER apart, i.e.
# LESS eccentric. So 75th-percentile ECCENTRICITY is the 25th-percentile GAP,
# = 1.39 l0. Where the existing cells actually sat, measured on their written
# phase fields rather than from the design formula:
#
#     rve_square_2fibre_offset  gap 4.32 l0 -> 91st pct gap =  9th pct ecc
#     rve_square_2fibre_tight   gap 1.62 l0 -> 30th pct gap = 70th pct ecc
#
# So the _offset cell was one of the LOOSEST configurations the real RVE
# contains, which is why its eccentricity is barely visible. The _tight cell
# was already near the target.
#
# The offset below was found by a numerical search over the actual VOXELIZED
# geometry -- generating each candidate and measuring the realized gap, not
# evaluating the continuum formula, because rasterization moves the fibre
# centroid and radius by a few tenths of a voxel. Components stay in a 5:3
# ratio so the diagonal mirror stays broken.

#
# THIS ONE ALSO MATCHES THE LARGE RVE'S FIBRE VOLUME FRACTION (0.065) and its
# voxel size (1.729443e-3 mm) exactly, so it is the most representative mini
# cell of the three: same phi, same voxel, same fibre radius, and now the same
# nearest-neighbour spacing statistic. Realized closest gap 1.43 l0.
#
# The offset is large -- 35% / 21% of the cell side -- because at phi 0.065 the
# fibres START 5.0 l0 apart, so reaching a 25th-percentile spacing takes a big
# shift. The result is a strongly asymmetric cell: closest gap 1.43 l0 against
# a widest of 8.83 l0, a ratio of 6.19. That lopsidedness is the point. A real
# random packing looks like this locally -- one tight pair and one large
# matrix-rich region -- and the regular array never did.

geometry:
  phi:       0.0646
  r_fib:     0.0070         # mm -- measured equivalent radius of the large RVE
  vox:       0.001729443
  N_min:     32
  nz:        40
  offset_vox: [14.0, 8.4]   # 75th-pct eccentricity, searched on the
                            # voxelized geometry; = 35.0% / 21.0% of the side
  fibre_dir: [0.0, 0.0, 1.0]
  Vf_yarn:   1.0

output:  sim/sim/11_mini_square
jobname: "rve_square_2fibre_ecc75"
