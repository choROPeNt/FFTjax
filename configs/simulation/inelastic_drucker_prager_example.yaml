# Drucker-Prager elastoplastic homogenization config — same script, same
# microstructure and same load/unload/reload cycle as
# configs/simulation/inelastic_j2_example.yaml, with the matrix phase swapped
# from `j2_plasticity` to the pressure-sensitive `drucker_prager`. That swap is
# the whole diff: DruckerPrager is a drop-in replacement for J2Plasticity
# (same state convention, same stress_and_tangent_field surface), so
# scripts/simulation/solve_inelastic.py needs no change to run it.
# {inelastic.input.stem} -> "rve_random_small_phi-0.35_seed-67" (used in output path)
#
# `input` below must already exist -- generate it first with
# scripts/generation/generate_rve.py and configs/generation/rve_random_small.yaml

inelastic:
  input: output/generation/rve_random_small_phi-0.35_seed-67.xdmf
  # input_L / input_dx (mm): domain size, for .npy or a bare .h5 only (no
  #   embedded length). Give exactly one -- the other is derived (L = n*dx).
  # input_dx: [0.001, 0.001, 0.001]

  # phase_key (default "phase"): field name for the phase array.
  # phase_key: phase

  # indexed by 0-based phase id (0=matrix, 1=fibre). `model` selects the
  # materialmodels.factory class; remaining keys are forwarded to its
  # constructor -- see src/materialmodels/factory.py for the model registry.
  # Any mix of plain elastic, j2_plasticity and drucker_prager phases works --
  # see materialmodels.assembly.assemble_local_update.
  materials:
    - model: drucker_prager
      E:        3.76e3           # MPa
      nu:       0.39
      # sigma_y0 is the shear-meridian intercept, NOT a uniaxial strength:
      # with a_f = 0.13 this yields at sigma_t = sigma_y0/(1 + a_f) = 49.6 MPa
      # in tension and sigma_c = sigma_y0/(1 - a_f) = 64.5 MPa in compression,
      # a compression/tension ratio of 1.3 typical of a cured epoxy.
      sigma_y0: 56.1              # MPa
      H:        1.0e3             # MPa, linear isotropic hardening modulus
      # For a CALIBRATED hardening curve instead of one constant slope,
      # replace H with a `hardening:` block. The law is named explicitly --
      # there is no default -- and the table is Abaqus' *PLASTIC card in the
      # same column order, (plastic strain, yield stress), so a measured
      # material card transcribes row for row:
      #
      #   hardening:
      #     law: piecewise_linear
      #     table:
      #       - [0.000, 56.1]     # first row MUST be at zero plastic strain
      #       - [0.020, 70.0]
      #       - [0.100, 78.0]     # perfectly plastic beyond the last row
      #
      # sigma_y0 then comes from the table's first row, and H must be
      # dropped (the two are the same quantity, so giving both raises).
      # Cover the strains you will actually reach: past the last row the
      # curve is PERFECTLY PLASTIC, and perfect plasticity is much harder to
      # converge than any positive slope -- a reversal that takes 6 Newton
      # iterations while hardening can burn maxiter_nr once voxels run onto
      # the plateau. Compare the "max accumulated plastic strain" this script
      # prints per case against the table's last row, and extend the table if
      # it has run past it.
      # Columns the other way round is caught at construction, not silently
      # run. `law: linear` with sigma_y0/H is the spelling above, written
      # out. See materialmodels.inelastic.hardening.
      a_f:      0.13              # friction coefficient; a_f = (m-1)/(m+1), m = sigma_c/sigma_t
      # a_g: dilatancy coefficient. Omit for associated flow (a_g = a_f);
      # set below a_f for the much weaker plastic dilatancy real polymers
      # show. a_g = 0 is volume-preserving plastic flow with a still
      # pressure-sensitive yield surface.
      a_g:      0.05
      # a_tip: rounds the cone's tensile VERTEX into a hyperbola,
      #   f = sqrt(q^2 + a_tip^2) + 3*a_f*p - sigma_y, asymptotic to the cone
      #   above and meeting the hydrostatic axis at the finite tensile pressure
      #   p_tip = (sigma_y - a_tip)/(3*a_f). Omit (or 0) for the classical
      #   sharp cone, which is the default and bit-for-bit what this config
      #   ran before the option existed.
      #   Reach for it when a CONFINED solve stalls: at the sharp vertex the
      #   return sets s = 0, the deviatoric part of the consistent tangent
      #   collapses, and the CG inside the nonlinear solver is handed a
      #   singular operator -- Newton then burns maxiter_nr and the step fails.
      #   Confinement is what drives you there: a pure-strain BC aims the
      #   stress path nearly along the hydrostatic axis (q/p ~ 0.5, against ~3
      #   for an unconfined uniaxial pull), straight at the vertex. So a_tip
      #   and mixed BC (control/stress_bar) are complementary rather than
      #   alternatives: relaxing the transverse directions stops aiming the
      #   path at the vertex at all, while a_tip keeps the tangent solvable
      #   wherever the path does end up.
      #   A few percent of sigma_y0 is plenty: at 10% the tangent's smallest
      #   eigenvalue holds at 55 where the sharp one is 0, for under 1% change
      #   in the stress response. Must be < sigma_y0, and needs a_f > 0.
      # a_tip:    5.61             # = 0.10 * sigma_y0
      name: epoxy matrix (Drucker-Prager)
    - model: isotropic_elastic
      E:    70.0e3                # MPa
      nu:   0.20
      name: glass fibre

  # macroscopic shear-strain cycle: 0 -> gamma_max -> -gamma_max -> gamma_max,
  # plus the virgin gamma=0 state -- traces a hysteresis loop in the
  # homogenized sigma[component] response. component picks which eps_bar
  # entry is driven (symmetrized: eps_bar[i,j] = eps_bar[j,i] = gamma/2).
  # Note a pure shear eps_bar drives no MACROSCOPIC pressure, so the
  # pressure sensitivity shows up only through the local p field the
  # heterogeneity itself generates -- drive a normal component (e.g.
  # component: [0, 0]) to see the tension/compression asymmetry directly.
  # For SEVERAL load cases on this same microstructure in one run (the six
  # base cases, or arbitrary ones), replace `component` with `cases` -- see
  # configs/simulation/inelastic_base6_example.yaml and problems.loadcases.
  loading:
    component:  [0, 1]           # shear in the 1-2 plane
    gamma_max:  0.03
    n_load:     10
    n_unload:   15
    n_reload:   15

  toler_lin:   1.0e-7
  maxiter_lin: 2000
  toler_nr:    1.0e-7
  maxiter_nr:  50

  # Also write the plastic strain TENSOR eps_p (Voigt 6) per increment, on top
  # of the scalar `strain_p` (= alpha) always written. Off by default. Worth
  # turning on here in particular: with a_g > 0 the flow is dilatant, and that
  # plastic volume change lives in tr(eps_p) alone -- alpha accumulates the
  # plastic multiplier and never sees it. scripts/postprocessing/homogenize.py
  # picks the field up on its own and adds a plastic_vol_strain column.
  # write_plastic_strain_tensor: true

output:  output/simulation
jobname: "{inelastic.input.stem}_drucker_prager"
